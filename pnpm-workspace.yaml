packages:
  - apps/*
  - packages/*

# pnpm only runs dependency install scripts that are allowed here.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  "@tailwindcss/oxide": true
  lightningcss: true

engineStrict: true

minimumReleaseAgeExclude:
  - lucide-react@1.49.0

# Expo supports pnpm's default isolated node_modules since SDK 54. If a React
# Native library fails to resolve or build, switch to `nodeLinker: hoisted`.
